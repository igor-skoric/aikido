{% load static %}

<header
    class="fixed top-0 left-0 w-full z-50 transition-colors duration-300"
    :class="solid ? 'bg-white/95 backdrop-blur-md shadow-sm' : 'bg-transparent'"
    x-data="{
        open: false,
        more: false,
        scrolled: window.scrollY > 24,
        isHome: {% if request.resolver_match.url_name == 'home' %}true{% else %}false{% endif %},
        isDarkTop: {% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'programs' %}true{% else %}false{% endif %},
        current: '{{ request.resolver_match.url_name }}',
        get solid() { return this.scrolled || this.open || !this.isDarkTop; },

        toggle() {
            this.open = !this.open;
            document.body.classList.toggle('menu-open', this.open);
        },
        close() {
            this.open = false;
            document.body.classList.remove('menu-open');
        }
    }"
    @scroll.window="scrolled = window.scrollY > 24"
    @keydown.escape.window="close(); more = false"
>
    <div class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-10"
         :class="solid ? 'border-b border-black/10' : 'border-b border-white/20'">
        <div class="flex items-center justify-between h-14 md:h-16 gap-3">
            <a href="{% url 'home' %}"
               class="flex items-center gap-2.5 sm:gap-3 min-w-0 shrink
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
                      focus-visible:outline-[#CF1833] rounded-sm">
                <img src="{% static 'img/website/logo.png' %}" alt="Realni Aikido Vokic"
                     class="h-9 w-9 sm:h-10 sm:w-10 md:h-11 md:w-11 object-contain rounded-full shrink-0"
                     width="44" height="44"/>
                <span class="font-display text-base sm:text-lg tracking-wide truncate"
                      :class="solid ? 'text-ink' : 'text-[#F4F0E8]'">
                    Realni Aikido Vokic
                </span>
            </a>

            <nav class="hidden lg:flex items-center gap-0.5 text-base font-semibold" aria-label="Glavna navigacija"
                 :class="solid ? 'text-ink' : 'text-[#F4F0E8]'">
                <a href="{% url 'home' %}"
                   class="px-2.5 py-2 rounded-sm transition border-b-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                   :class="[
                       current === 'home' ? 'border-[#CF1833]' : 'border-transparent',
                       solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                   ]">Početna</a>
                <a href="{% url 'locations' %}"
                   class="px-2.5 py-2 rounded-sm transition border-b-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                   :class="[
                       current === 'locations' ? 'border-[#CF1833]' : 'border-transparent',
                       solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                   ]">Lokacije</a>
                <a href="{% url 'programs' %}"
                   class="px-2.5 py-2 rounded-sm transition border-b-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                   :class="[
                       current === 'programs' ? 'border-[#CF1833]' : 'border-transparent',
                       solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                   ]"
                   {% if request.resolver_match.url_name == 'programs' %}aria-current="page"{% endif %}>Programi</a>
                <a href="{% url 'instructors' %}"
                   class="px-2.5 py-2 rounded-sm transition border-b-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                   :class="[
                       current === 'instructors' || current === 'instructor' ? 'border-[#CF1833]' : 'border-transparent',
                       solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                   ]">Instruktori</a>
                <a href="{% url 'blog' %}"
                   class="px-2.5 py-2 rounded-sm transition border-b-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                   :class="[
                       current === 'blog' || current === 'post' ? 'border-[#CF1833]' : 'border-transparent',
                       solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                   ]">Blog</a>
                <a href="{% url 'contact' %}"
                   class="px-2.5 py-2 rounded-sm transition border-b-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                   :class="[
                       current === 'contact' ? 'border-[#CF1833]' : 'border-transparent',
                       solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                   ]">Kontakt</a>
                <div class="relative" @mouseenter="more = true" @mouseleave="more = false">
                    <button type="button"
                            class="px-2.5 py-2 rounded-sm transition inline-flex items-center gap-1
                                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                            :class="[
                                current === 'timeline' || current === 'masters' ? 'border-b-2 border-[#CF1833]' : 'border-b-2 border-transparent',
                                solid ? 'hover:bg-brand-blue-light hover:text-brand-blue' : 'hover:bg-white/10'
                            ]"
                            :aria-expanded="more.toString()"
                            aria-haspopup="true"
                            @click="more = !more">
                        Više
                        <svg class="w-4 h-4 transition-transform" :class="more && 'rotate-180'" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 011.08 1.04l-4.25 4.25a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"/>
                        </svg>
                    </button>
                    <div x-show="more" x-cloak
                         class="absolute right-0 top-full pt-2 w-48"
                         x-transition.opacity>
                        <ul class="bg-white text-ink border border-stone-200 rounded-brand shadow-lg py-1 text-sm">
                            <li><a href="{% url 'timeline' %}" class="block px-4 py-2 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none">Istorijat</a></li>
                            <li><a href="{% url 'masters' %}" class="block px-4 py-2 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none">Majstori</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <button type="button"
                    class="lg:hidden relative w-11 h-11 flex items-center justify-center rounded-sm shrink-0 transition
                           focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                    :class="solid ? 'hover:bg-brand-blue-light' : 'hover:bg-white/10'"
                    @click="toggle()"
                    :aria-expanded="open.toString()"
                    aria-controls="mobile-menu"
                    aria-label="Meni">
                <span class="sr-only">Otvori meni</span>
                <span class="absolute w-5 h-0.5 transition"
                      :class="[open ? 'rotate-45' : '-translate-y-1.5', solid ? 'bg-ink' : 'bg-[#F4F0E8]']"></span>
                <span class="absolute w-5 h-0.5 transition"
                      :class="[open && 'opacity-0', solid ? 'bg-ink' : 'bg-[#F4F0E8]']"></span>
                <span class="absolute w-5 h-0.5 transition"
                      :class="[open ? '-rotate-45' : 'translate-y-1.5', solid ? 'bg-ink' : 'bg-[#F4F0E8]']"></span>
            </button>
        </div>
    </div>

    {# Backdrop #}
    <div x-show="open"
         x-cloak
         x-transition.opacity.duration.200ms
         class="fixed inset-0 bg-black/45 z-[60] lg:hidden"
         @click="close()"
         aria-hidden="true"></div>

    {# Drawer #}
    <nav id="mobile-menu"
         x-show="open"
         x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full"
         class="fixed top-0 right-0 h-[100dvh] w-[min(20rem,88vw)] bg-white shadow-2xl z-[70] lg:hidden overflow-y-auto overscroll-contain"
         role="dialog"
         aria-modal="true"
         aria-label="Mobilni meni">
        <div class="sticky top-0 flex items-center justify-between px-4 h-14 border-b bg-white z-10">
            <span class="font-display text-sm tracking-wide">Meni</span>
            <button type="button"
                    class="w-10 h-10 flex items-center justify-center rounded-sm hover:bg-stone-100 text-lg
                           focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#CF1833]"
                    @click="close()"
                    aria-label="Zatvori meni">✕</button>
        </div>
        <ul class="flex flex-col text-base font-medium py-2 pb-10">
            <li><a href="{% url 'home' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light active:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Početna</a></li>
            <li><a href="{% url 'locations' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Lokacije</a></li>
            <li><a href="{% url 'programs' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Programi</a></li>
            <li><a href="{% url 'instructors' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Instruktori</a></li>
            <li><a href="{% url 'blog' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Blog</a></li>
            <li><a href="{% url 'contact' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Kontakt</a></li>
            <li class="mt-2 border-t border-stone-100 pt-2">
                <span class="block px-6 py-2 text-xs uppercase tracking-wider text-muted font-semibold">Više</span>
            </li>
            <li><a href="{% url 'timeline' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Istorijat</a></li>
            <li><a href="{% url 'masters' %}" class="block px-6 py-3.5 hover:bg-brand-blue-light focus-visible:bg-brand-blue-light focus-visible:outline-none" @click="close()">Majstori</a></li>
        </ul>
    </nav>
</header>
