<nav class="mb-6 sm:mb-8" aria-label="Breadcrumb">
    <ol class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs sm:text-sm text-muted bg-white/80 backdrop-blur px-3 sm:px-4 py-2 sm:py-2.5 rounded-brand shadow-sm">
        {% for name, url in breadcrumbs %}
        <li class="flex items-center gap-2 min-w-0">
            {% if not forloop.last %}
            <a href="{{ url }}" class="hover:text-brand-blue transition truncate max-w-[10rem] sm:max-w-none">{{ name }}</a>
            <span class="text-stone-300 shrink-0" aria-hidden="true">/</span>
            {% else %}
            <span class="text-ink font-medium truncate" aria-current="page">{{ name }}</span>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
