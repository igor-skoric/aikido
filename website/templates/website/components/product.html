{% load static %}

{% for product in products %}
<a href="{% url 'product' product.slug %}" class="group block reveal">
    <article class="bg-white rounded-brand overflow-hidden shadow-sm ring-1 ring-stone-200/80 transition duration-300 group-hover:-translate-y-1 group-hover:shadow-md h-full">
        <div class="aspect-[4/3] overflow-hidden bg-stone-100">
            <img src="{{ product.main_image.url }}"
                 alt="{{ product.name }}"
                 class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
        </div>
        <div class="p-4 text-center">
            <h2 class="font-display text-lg text-ink">{{ product.name }}</h2>
            <p class="mt-1 font-semibold text-brand-blue">{{ product.price }} RSD</p>
        </div>
    </article>
</a>
{% empty %}
<p class="text-muted col-span-full text-center py-12">Nema proizvoda u ovoj kategoriji.</p>
{% endfor %}
