{% load static %}

{% for post in blog %}
<a href="{% url 'post' post.slug %}" class="group block reveal">
    <article class="bg-white rounded-brand overflow-hidden shadow-sm ring-1 ring-stone-200/80 transition duration-300 group-hover:-translate-y-1 group-hover:shadow-md h-full">
        <div class="aspect-[4/3] overflow-hidden">
            <img src="{{ post.main_image.url }}"
                 alt="{{ post.title }}"
                 class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
        </div>
        <div class="p-5 relative">
            <time class="absolute -top-3 right-4 text-xs font-semibold px-2.5 py-1 rounded-md bg-brand-blue text-white shadow"
                  datetime="{{ post.date|date:'Y-m-d' }}">
                {{ post.date|date:"d.m.Y" }}
            </time>
            <h2 class="font-display text-xl text-ink">{{ post.title }}</h2>
            <p class="mt-3 text-base text-muted line-clamp-3">{{ post.description|striptags|truncatechars:120 }}</p>
        </div>
    </article>
</a>
{% empty %}
<p class="text-muted col-span-full text-center py-12">Trenutno nema objava.</p>
{% endfor %}
