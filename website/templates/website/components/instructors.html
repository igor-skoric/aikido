{% load static %}

<a href="{% url 'instructor' instructor.slug %}">
    <!-- Kartica 1 -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden transition-transform duration-300 transform hover:-translate-y-2">
        <div class="aspect-[4/5] w-full">
            <img src="{{instructor.photo.url}}" alt="Instruktor 1" class="w-full h-full object-cover">
        </div>
        <div class="relative p-4">
            <div class="absolute -top-3 right-2 bg-blue-600 p-2 rounded-xl">
                <p class="text-white text-sm">{{instructor.get_belt_rank_display}}</p>
            </div>
            <h2 class="text-xl font-semibold text-gray-800">{{instructor.name}}</h2>
            <div class="flex gap-2 items-center">
                <hr class="my-2 border-gray-300 w-[40%] md:w-[50%]">
                <p class="text-indigo-600 font-medium">{{instructor.get_title_display}}</p>
            </div>
            <p class="text-gray-600 text-sm mb-2">{{instructor.short_description|slice:100}}..</p>
        </div>
    </div>
</a>
