{% load static %}

<a href="{% url 'instructor' instructor.slug %}" class="group block reveal">
    <article class="bg-white rounded-brand overflow-hidden shadow-sm ring-1 ring-stone-200/80 transition duration-300 group-hover:-translate-y-1 group-hover:shadow-md">
        <div class="aspect-[4/5] overflow-hidden">
            <img src="{{ instructor.photo.url }}"
                 alt="{{ instructor.name }}"
                 class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
        </div>
        <div class="p-5 relative">
            <span class="absolute -top-3 right-4 text-xs font-semibold px-2.5 py-1 rounded-md bg-brand-blue text-white shadow">
                {{ instructor.get_belt_rank_display }}
            </span>
            <h2 class="font-display text-xl text-ink">{{ instructor.name }}</h2>
            <p class="mt-1 text-sm font-medium text-brand-blue">{{ instructor.get_title_display }}</p>
            <p class="mt-3 text-base text-muted line-clamp-3">{{ instructor.short_description }}</p>
        </div>
    </article>
</a>
